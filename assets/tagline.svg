<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Code, create, innovate">
<title>Code, create, innovate</title>
<defs>
<linearGradient id="gt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A18"/><stop offset="1" stop-color="#141040"/></linearGradient>
</defs>
<style>text{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}@keyframes flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes show{from{opacity:0}to{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.pulse{stroke-dasharray:6 94;animation:flow 3s linear infinite}.node{animation:pulse 2.4s ease-in-out infinite}.cur{animation:blink 1s steps(1) infinite}.ln{animation:show .5s ease backwards}@keyframes hl{0%{fill-opacity:.12}10%,33%{fill-opacity:.5}43%,100%{fill-opacity:.12}}.hl{animation:hl 3s infinite}</style>
<rect x=".5" y=".5" width="899" height="179" rx="18" fill="url(#bg)" stroke="#1E2A4D"/><text x="450" y="62" text-anchor="middle" font-size="26" font-weight="800" fill="url(#gt)">Turning curiosity into circuits and code.</text><path d="M315,126 H585" stroke="#27366A" stroke-width="2" fill="none"/><path d="M315,126 H585" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" fill="none" pathLength="100" class="pulse" style="animation-duration:2s"/><rect x="160" y="102" width="160" height="48" rx="12" fill="#0C1226"/><rect class="hl" x="160" y="102" width="160" height="48" rx="12" fill="#7C3AED" fill-opacity=".12" stroke="#A5B4FC" stroke-opacity=".7" style="animation-delay:0s"/><text x="240" y="132" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="3" fill="#E6EDFF">CODE</text><rect x="370" y="102" width="160" height="48" rx="12" fill="#0C1226"/><rect class="hl" x="370" y="102" width="160" height="48" rx="12" fill="#7C3AED" fill-opacity=".12" stroke="#A5B4FC" stroke-opacity=".7" style="animation-delay:1s"/><text x="450" y="132" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="3" fill="#E6EDFF">CREATE</text><rect x="580" y="102" width="160" height="48" rx="12" fill="#0C1226"/><rect class="hl" x="580" y="102" width="160" height="48" rx="12" fill="#7C3AED" fill-opacity=".12" stroke="#A5B4FC" stroke-opacity=".7" style="animation-delay:2s"/><text x="660" y="132" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="3" fill="#E6EDFF">INNOVATE</text>
</svg>